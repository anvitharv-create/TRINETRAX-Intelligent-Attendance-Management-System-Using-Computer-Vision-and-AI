services:
  backend:
    image: anvitharv11/trinetrax-attendance-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ATTENDANCE_DB_URL: sqlite:////data/attendance.db
    volumes:
      - ./private-data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: anvitharv11/trinetrax-attendance-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
